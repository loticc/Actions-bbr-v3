name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 3:00 自动运行（北京时间 11:00）
  workflow_dispatch:       # 允许手动点击运行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and sync
        run: |
          # 添加真正的上游仓库（推荐同步 byJoey）
          git remote add upstream https://github.com/byJoey/Actions-bbr-v3.git || true
          git fetch upstream
          
          # 切换到 main 分支并合并上游
          git checkout main
          git merge upstream/main --no-edit || {
            echo "有冲突，需要手动解决"
            exit 1
          }
          
          # 推送回你自己的仓库
          git push origin main
